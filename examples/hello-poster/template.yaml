# The smallest template worth rendering: two formats, two variables, no assets. It exists so the
# first command in the README and the quick start produces a picture on a fresh install, before
# anyone has installed a font, enabled an extension, or read the authoring reference.
version: 0.1.0

variables:
  title: {type: string, required: true, doc: "Main headline"}
  # Optional with no declared default: the '| default(...)' operator below is the fallback.
  subtitle: {type: string, required: false, doc: "Supporting line under the title"}

formats:
  square:
    canvas: {width: 1080px, height: 1080px, dpi: 96}
  story:
    canvas: {width: 1080px, height: 1920px, dpi: 96}

preview_data:
  title: "Hello Arcavex"
  subtitle: "A deterministic render"

root:
  type: group
  id: root
  children:
    - id: background
      type: shape
      shape: rect
      style: {fill: "#1a1a2e"}
      constraints:
        anchor: {top: parent.top, left: parent.left}
        size: {w: fill, h: fill}

    - id: accent
      type: shape
      shape: rrect
      style: {fill: "#e94560", corner_radius: 28px}
      constraints:
        anchor: {center_x: parent.center_x, center_y: parent.center_y}
        size: {w: 74%, h: 44%}

    - id: title
      type: text
      text: "{{ title }}"
      style:
        font: Inter
        font_size: 76px
        font_weight: 800
        color: "#ffffff"
      paragraph: {align: center}
      constraints:
        anchor: {center_x: parent.center_x, top: parent.center_y-70px}
        size: {w: 64%, h: fit_content}

    - id: subtitle
      type: text
      text: "{{ subtitle | default('A deterministic render') }}"
      style:
        font: Inter
        font_size: 34px
        font_weight: 500
        color: "#ffe0e6"
      paragraph: {align: center}
      constraints:
        anchor: {center_x: parent.center_x, top: parent.center_y+60px}
        size: {w: 64%, h: fit_content}
