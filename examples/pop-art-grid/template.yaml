# Pop-art Warhol grid — golden case #3 (spec §8.5).
#
# One source portrait repeated across a full-bleed 2x2 grid; each cell recolours it with a
# different palette from the `pop-art` style pack and screens it at a different halftone angle.
# The per-cell effect chain is grade -> duotone -> posterize (three colour effects; the first
# two fuse into one matrix) -> halftone (SkSL dot-screen) -> grain (seeded). Palettes and the
# halftone/grain presets come from the style pack; the title uses its display role.
style: pop-art@0.1

variables:
  title: {type: string, default: "POP ICON"}
  subtitle: {type: string, default: "four takes · one face"}
  cells:
    type: list
    default:
      - {id: a, palette: warhol_1, angle: 15, x: 0,   y: 0}
      - {id: b, palette: warhol_2, angle: 75, x: 540, y: 0}
      - {id: c, palette: warhol_3, angle: 45, x: 0,   y: 540}
      - {id: d, palette: warhol_4, angle: 0,   x: 540, y: 540}

formats:
  square:
    canvas: {width: 1080px, height: 1080px, dpi: 144}

seed: 41

root:
  id: root
  type: group
  children:
    - id: bg
      type: shape
      shape: rect
      style: {fill: "#111111"}
      constraints: {anchor: {top: parent.top, left: parent.left}, size: {w: 100%, h: 100%}}

    - repeat: "{{ cells }}"
      as: cell
      key: "{{ cell.id }}"
      node:
        id: cell
        type: group
        clip: true
        constraints:
          anchor:
            left: "parent.left+{{ cell.x }}px"
            top: "parent.top+{{ cell.y }}px"
          size: {w: 540px, h: 540px}
        children:
          - id: panel
            type: shape
            shape: rect
            style: {fill: "{{ palette[cell.palette][2] }}"}
            constraints: {anchor: {top: parent.top, left: parent.left}, size: {w: 100%, h: 100%}}
          - id: portrait
            type: image
            asset: source.png
            fit: cover
            effects:
              - {name: grade, params: {contrast: 1.15, saturation: 0.9}}
              - {name: duotone, params: {shadow: "{{ palette[cell.palette][3] }}", highlight: "{{ palette[cell.palette][0] }}"}}
              - {name: posterize, params: {levels: 5}}
              - {preset: halftone, params: {angle: "{{ cell.angle }}", ink: "{{ palette[cell.palette][3] }}"}}
              - {preset: grain}
            constraints: {anchor: {top: parent.top, left: parent.left}, size: {w: 100%, h: 100%}}

    - id: title_bar
      type: shape
      shape: rect
      style: {fill: "#FFD600", stroke: "#111111", stroke_width: 6px}
      constraints:
        anchor: {center_x: parent.center_x, center_y: parent.center_y}
        size: {w: 80%, h: 176px}
    - id: title
      type: text
      text: "{{ title }}"
      style_role: heading
      style: {font_size: 40pt}
      constraints:
        anchor: {center_x: parent.center_x, center_y: parent.center_y-20px}
        size: {w: 76%, h: 96px}
    - id: subtitle
      type: text
      text: "{{ subtitle }}"
      style_role: accent
      style: {color: "#111111", font_size: 18pt}
      constraints:
        anchor: {center_x: parent.center_x, center_y: parent.center_y+46px}
        size: {w: 76%, h: 36px}
