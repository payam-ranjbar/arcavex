version: 0.1.0

# IPEN bilingual event poster (golden case #2, simplified). One template renders Farsi (rtl)
# and English (ltr) across square / story / A4 from the same node tree. It exercises: locale
# direction + digit policy + font overrides + data overlay, sibling anchors, a vstack, a
# diamond-grid masked image, a rotated accent, and text fit policies. See README.md.

variables:
  title:    {type: string, required: true, doc: "Headline (localised)"}
  subtitle: {type: string, required: true, doc: "Supporting line (localised)"}
  venue:    {type: string, required: true, doc: "Location line (localised)"}
  day:      {type: number, required: true, doc: "Event day of month (localised digits)"}
  month:    {type: string, required: true, doc: "Event month name (localised)"}
  time:     {type: string, required: true, doc: "Event start time, e.g. 17:00"}

formats:
  square:
    canvas: {width: 1080px, height: 1080px, dpi: 96}
  story:
    canvas: {width: 1080px, height: 1920px, dpi: 96}
  a4:
    canvas: {width: 210mm, height: 297mm, dpi: 300}
    # On the tall A4 sheet the hero band gets a little more room.
    patch:
      - set: nodes.hero.constraints.size.h
        value: 38%

locales:
  en:
    direction: ltr
  fa:
    direction: rtl
    digits: fa
    # In Farsi context prefer the Persian text face for anything declared Inter.
    fonts:
      Inter: [Vazirmatn, Inter]

preview_data:
  title: "A Cup of Experience"
  subtitle: "A gathering to share the experience of Iranian professionals"
  venue: "Hunter Student Commons"
  day: 15
  month: "June"
  time: "17:00"

root:
  type: group
  id: root
  children:
    - id: background
      type: shape
      shape: rect
      style: {fill: "#0e1428"}
      constraints:
        anchor: {top: parent.top, left: parent.left}
        size: {w: fill, h: fill}

    # Hero photo region with the diamond-grid mask (gutters show the dark background through).
    - id: hero
      type: image
      asset: logo.png
      fit: cover
      mask: {component: diamond_grid, params: {cell: 108pt, gutter: 7pt, angle: 45}}
      constraints:
        anchor: {top: parent.top, start: parent.start}
        size: {w: 100%, h: 42%}

    # A red accent bar under the hero, rotated a few degrees like the reference frames.
    - id: accent-bar
      type: shape
      shape: rrect
      style: {fill: "#e23b4e", corner_radius: 4pt}
      transform: {rotate: -4, origin: center}
      constraints:
        anchor: {start: parent.start+56pt, top: hero.bottom+26pt}
        size: {w: 150pt, h: 12pt}

    - id: title
      type: text
      text: "{{ title }}"
      # A large display size that shrink_to_fit reduces (down to min_size) to fit two lines.
      style: {font: [Estedad, Inter], font_size: 72pt, font_weight: 900, color: "#ffffff"}
      paragraph: {align: start, direction: auto}
      fit: {policy: shrink_to_fit, min_size: 30pt, max_lines: 2}
      constraints:
        anchor: {start: parent.start+56pt, top: accent-bar.bottom+18pt}
        size: {w: 84%, h: 116pt}

    - id: subtitle
      type: text
      text: "{{ subtitle }}"
      style: {font: [Inter, Vazirmatn], font_size: 27pt, font_weight: 500, color: "#c7d0e8"}
      paragraph: {align: start, direction: auto}
      fit: {policy: wrap, overflow: clip, max_lines: 2}
      constraints:
        anchor: {start: parent.start+56pt, top: title.bottom+16pt}
        size: {w: 80%, h: fit_content}

    # Date/time box: a red-framed card whose two lines flow in a vstack; the day uses locale
    # digits (fa -> ۱۵) automatically.
    - id: datebox
      type: group
      constraints:
        anchor: {start: parent.start+56pt, top: subtitle.bottom+26pt}
        size: {w: 280pt, h: 108pt}
      children:
        - id: date-frame
          type: shape
          shape: rrect
          style: {fill: "#141c33", stroke: "#e23b4e", stroke_width: 3pt, corner_radius: 12pt}
          constraints:
            anchor: {top: parent.top, left: parent.left}
            size: {w: fill, h: fill}
        - id: date-lines
          type: group
          layout: vstack
          gap: 4pt
          padding: 16pt
          cross_align: stretch
          main_align: center
          constraints:
            anchor: {top: parent.top, left: parent.left}
            size: {w: fill, h: fill}
          children:
            - id: date-day
              type: text
              text: "{{ day }} {{ month }}"
              style: {font: [Estedad, Inter], font_size: 34pt, font_weight: 700, color: "#ffffff"}
              paragraph: {align: start, direction: auto}
              constraints:
                size: {w: fill, h: fit_content}
            - id: date-time
              type: text
              text: "{{ time }}"
              style: {font: [Inter, Vazirmatn], font_size: 26pt, font_weight: 600, color: "#e23b4e"}
              paragraph: {align: start, direction: auto}
              constraints:
                size: {w: fill, h: fit_content}

    - id: venue
      type: text
      text: "{{ venue }}"
      style: {font: [Inter, Vazirmatn], font_size: 24pt, font_weight: 500, color: "#9aa6c4"}
      paragraph: {align: start, direction: auto}
      fit: {policy: truncate, max_lines: 2}
      constraints:
        anchor: {start: parent.start+56pt, top: datebox.bottom+22pt}
        size: {w: 82%, h: fit_content}
