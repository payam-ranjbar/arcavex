# Farsi overlay, merged over data.yaml when --locale fa is used (mapping merge: only the keys
# below are replaced). Note the split of responsibilities: `day` is a NUMBER, so the locale's
# digit policy shows it with Persian digits automatically (۱۵) — it is not repeated here. The
# string values (`title`, `subtitle`, `venue`, `month`, `time`, `cta`) are localised here
# because the digit policy only maps numeric values, so a string like "17:00" must be written
# in Persian digits explicitly.
title: "یک فنجان تجربه"
subtitle: "دورهمی و انتقال تجربه ایرانیان فعال در صنعت و آموزش"
venue: "هانتر استیودنت کامانز — فضای هم‌اندیشی"
month: "ژوئن"
time: "۱۷:۰۰"
cta: "شبکه متخصصان ایرانی"
