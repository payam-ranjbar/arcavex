# Locale sidecar (top-level mapping IS the template's `locales` section). The composition is
# locale-stable; each locale only flips text direction, digit policy and font stacks. `day` is
# a number, so the fa digit policy renders it with Persian digits automatically.

en:
  direction: ltr

fa:
  direction: rtl
  digits: fa
  # No font overrides on purpose: every Farsi-bearing node already declares a Persian-capable
  # first family (Lalezar/Vazirmatn), and the always-English runs (org caption, venue, guest
  # titles) must keep their Latin face — a blanket Inter→Vazirmatn override would restyle them.
