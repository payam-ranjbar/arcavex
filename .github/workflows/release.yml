name: release

# Release orchestration. Release Please keeps one release pull request per product from
# Conventional Commits; merging one creates that product's tag and GitHub Release, and this
# workflow then runs the matching build lane.
#
# The lanes are called as reusable workflows rather than triggered by the tag push. A tag created
# with the built-in GITHUB_TOKEN does not start another workflow run, so an `on: push: tags` lane
# would silently never fire.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: release pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      engine_released: ${{ steps.release.outputs['.--release_created'] }}
      engine_tag: ${{ steps.release.outputs['.--tag_name'] }}
      desktop_released: ${{ steps.release.outputs['apps/desktop--release_created'] }}
      desktop_tag: ${{ steps.release.outputs['apps/desktop--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  engine:
    name: engine artifacts
    needs: prepare
    if: needs.prepare.outputs.engine_released == 'true'
    uses: ./.github/workflows/release-engine.yml
    with:
      tag: ${{ needs.prepare.outputs.engine_tag }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write

  desktop:
    name: desktop artifacts
    # Ordered after the engine lane rather than independent of it: when both release together the
    # desktop stages the engine archive the engine lane has just uploaded, so it must exist first.
    needs: [prepare, engine]
    if: |
      always()
      && needs.prepare.outputs.desktop_released == 'true'
      && (needs.engine.result == 'success' || needs.engine.result == 'skipped')
    uses: ./.github/workflows/release-desktop.yml
    with:
      tag: ${{ needs.prepare.outputs.desktop_tag }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
