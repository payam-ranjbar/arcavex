[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcavex"
version = "0.1.0"
description = "Local-first, headless, deterministic, template-driven rendering engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Arcavex" }]
# Every dependency carries a floor and an upper bound so a fresh resolve cannot pick an untested
# major. The version in each trailing comment is the one CI and the reference machine verified.
# tests/unit/test_packaging.py fails on any requirement added without both bounds.
dependencies = [
    "skia-python>=144.0,<145",      # 144.0.post2
    "pydantic>=2.13,<3",            # 2.13.4
    "typer>=0.26,<0.27",            # 0.26.8 — pre-1.0, minor bumps are breaking
    "ruamel.yaml>=0.19,<0.20",      # 0.19.1 — pre-1.0
    "rich>=15,<16",                 # 15.0.0
    "watchfiles>=1.2,<2",           # 1.2.0
    "numpy>=1.26,<3",               # 2.5.1
    "segno>=1.6,<2",                # 1.6.6
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",              # 9.1.1
    "hypothesis>=6.156,<7",         # 6.156.6
    "ruff>=0.15.21,<0.16",          # pre-1.0: a minor bump changes which lints fire
    "mypy>=2.2,<3",                 # 2.2.0
    "import-linter>=2.13,<3",       # 2.13
    "pillow>=12.3,<13",             # 12.3.0
    "mcp>=1.28,<2",                 # 1.28.1 — 2.0.0 removed mcp.server.fastmcp
]

[project.scripts]
arcavex = "arcavex.clients.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arcavex"]

# Ship the bundled fonts inside the wheel so an installed engine renders without the dev tree
# (spec §8.5 packaged-install test). They live in library-seed/fonts in the repo; force-include
# maps them under the package at arcavex/_bundled/fonts, where the text service discovers them
# (services.text.find_font_dirs). ICU (icudtl.dat) ships with the skia-python dependency, so it
# needs no packaging here — 'arcavex doctor' diagnoses it if a build cannot locate it (ADR-0001).
[tool.hatch.build.targets.wheel.force-include]
"library-seed/fonts" = "arcavex/_bundled/fonts"
# The design skill ships in the wheel so `arcavex skill install` works from a pip install with no
# source checkout; services.skills.bundled_skill_dir resolves this path first, then the repo.
"skills/arcavex-design-studio" = "arcavex/_bundled/skill"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["skia", "skia.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "arcavex"

[[tool.importlinter.contracts]]
name = "Kernel is pure (imports nothing from builtin/services/clients/sdk)"
type = "forbidden"
source_modules = ["arcavex.kernel"]
forbidden_modules = [
    "arcavex.builtin",
    "arcavex.services",
    "arcavex.clients",
    "arcavex.bootstrap",
    "arcavex.sdk",
]

# The extension SDK is the public, downward-facing surface a trusted local extension imports. It
# may re-export the kernel contracts and IR value types but must never reach up into services,
# built-ins, clients, or the composition root — otherwise an extension importing only arcavex.sdk
# would transitively depend on engine internals (spec §7.1). This makes the SDK boundary the same
# mechanized rule the extension import-surface validator enforces on extension code (spec §7.2).
[[tool.importlinter.contracts]]
name = "SDK imports only the kernel (never services/builtin/clients)"
type = "forbidden"
source_modules = ["arcavex.sdk"]
forbidden_modules = [
    "arcavex.services",
    "arcavex.builtin",
    "arcavex.clients",
    "arcavex.bootstrap",
]

# Built-ins face downward toward the kernel and the shared text service (the single shaper,
# spec §4.3); they must never reach up into a client or the composition root. This makes the
# intended boundary explicit so the Phase 0 builtin -> services.text shortcut does not creep
# into importing CLI/bootstrap code (CR-20).
[[tool.importlinter.contracts]]
name = "Built-ins do not import clients or the composition root"
type = "forbidden"
source_modules = ["arcavex.builtin"]
forbidden_modules = [
    "arcavex.clients",
    "arcavex.bootstrap",
]

# Services (compiler, expressions, text, authoring, …) resolve template functions through an
# injected registry table wired by bootstrap; they must never import the built-ins directly.
# This keeps the single-source-of-truth function table honest (Phase 1 CR-15 remediation).
[[tool.importlinter.contracts]]
name = "Services do not import built-ins or the composition root"
type = "forbidden"
source_modules = ["arcavex.services"]
forbidden_modules = [
    "arcavex.builtin",
    "arcavex.bootstrap",
    "arcavex.clients",
]

# The user-facing clients (CLI, MCP server) are parse-and-present only: they call the service
# facade through kernel.api and build one via bootstrap, and must never reach into services or
# built-in internals directly (spec §6.2, CR-3). allow_indirect_imports keeps the check on each
# module's own imports — the shared watch helper legitimately uses services.template.loader and
# is governed separately — so this makes the parse-present boundary linted, not review-only.
[[tool.importlinter.contracts]]
name = "CLI and MCP clients import only kernel.api + bootstrap (no services/builtin internals)"
type = "forbidden"
source_modules = [
    "arcavex.clients.cli",
    "arcavex.clients.mcp_server",
]
forbidden_modules = [
    "arcavex.services",
    "arcavex.builtin",
]
allow_indirect_imports = "true"
